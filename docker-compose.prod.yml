services:
  postgres:
    image: postgres:17-alpine
    container_name: erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-erp_system}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - erp_network

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/your-org-or-user/erp-backend}:${APP_TAG:-latest}
    container_name: erp-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      DB_NAME: ${POSTGRES_DB:-erp_system}
      SERVER_PORT: :8080
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:?set WEBAUTHN_RP_ID in .env.prod}
      WEBAUTHN_RP_ORIGINS: ${WEBAUTHN_RP_ORIGINS:?set WEBAUTHN_RP_ORIGINS in .env.prod}
    expose:
      - "8080"
    networks:
      - erp_network

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/your-org-or-user/erp-frontend}:${APP_TAG:-latest}
    container_name: erp-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - erp_network

networks:
  erp_network:
    driver: bridge

volumes:
  postgres_data: