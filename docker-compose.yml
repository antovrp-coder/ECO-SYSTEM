services:
  postgres:
    image: postgres:17-alpine
    container_name: erp-postgres
    environment:
      POSTGRES_DB: erp_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d erp_system"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./erp-backend
    container_name: erp-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: erp_system
      SERVER_PORT: :8080
      WEBAUTHN_RP_ID: localhost
      WEBAUTHN_RP_ORIGINS: http://localhost:4200,http://127.0.0.1:4200
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./erp-frontend
    container_name: erp-frontend
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  postgres_data: