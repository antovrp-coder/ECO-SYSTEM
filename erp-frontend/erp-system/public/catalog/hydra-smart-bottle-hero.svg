  <text x="96" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" fill="#274538">Hydra Smart Bottle</text>
  <text x="96" y="188" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#5f7968">Temperature tracking with hydration glow ring</text>
