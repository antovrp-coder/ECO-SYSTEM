  </defs>
  <rect width="960" height="1080" fill="url(#bg)"/>
  <ellipse cx="478" cy="900" rx="208" ry="50" fill="#d6ead6"/>
  <rect x="392" y="206" width="176" height="652" rx="88" fill="url(#bottle)"/>
  <rect x="422" y="156" width="116" height="108" rx="34" fill="#284536"/>
