<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1080" role="img" aria-labelledby="title desc">
  <title id="title">Hydra Smart Bottle hero image</title>
  <desc id="desc">Smart hydration bottle shown against a wellness-inspired backdrop.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef9ef"/>
      <stop offset="100%" stop-color="#f8fff2"/>
    </linearGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a9171"/>
