apiVersion: v1
kind: ConfigMap
metadata:
  name: erp-backend-config
  namespace: erp-system
data:
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "erp_system"
  DB_USER: "postgres"
  SERVER_PORT: ":8080"
  WEBAUTHN_RP_ID: "localhost"
  WEBAUTHN_RP_ORIGINS: "http://localhost:4200,http://localhost:80,http://127.0.0.1:4200"
---
apiVersion: v1
kind: Secret
metadata:
  name: erp-secrets
  namespace: erp-system
type: Opaque
stringData:
  POSTGRES_PASSWORD: "postgres_secure_password"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp-backend
  namespace: erp-system
  labels:
    app: erp-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: erp-backend
  template:
    metadata:
      labels:
        app: erp-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/your-org-or-user/erp-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: erp-backend-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: erp-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: erp-system
  labels:
    app: erp-backend
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: erp-backend
